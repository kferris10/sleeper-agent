# ---- Sections below are used by later phases (analyze/deliver); inert in Phase 1 ----

[philosophy]
risk_tolerance = "high"          # title equity over weekly comfort
faab_aggressiveness = "high"     # (priority league: applies to willingness to burn waiver priority)
trade_appetite = "active"
priorities = [
  "Championship upside over safe floor",
  "Keep startable RB depth through the bye gauntlet (weeks 10-11 hit this roster hard)",
  "Stream DEF and K by matchup rather than holding season-long",
]
notes = """Primary goal: win the league. Secondary goal: do not finish last.
When a start/sit call is close, take the higher-ceiling player - especially as an underdog. As a clear favorite, prefer the safer floor.
This league uses waiver PRIORITY, not FAAB: burn a high priority position only on a potential league-winner; churn bench spots freely via free agency after waivers clear.
Trades: hunt 2-for-1 consolidations that upgrade the starting lineup; buy low on injured stars when the playoff timeline (weeks 14-17) works.
Only weigh the avoid-last-place goal when the title path is realistically gone; never sacrifice championship equity for mid-table comfort."""

[claude]
model = "claude-opus-5"
max_tokens = 16000
web_search = true

[delivery]
channel = "email"                # email | slack | discord | none
email_to = "kevin.ferris10@gmail.com"
