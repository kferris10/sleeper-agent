[project]
name = "sleeper-analyst"
version = "0.1.0"
description = "Weekly Sleeper fantasy football analyst: collect league state, analyze with Claude, deliver a decision packet"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=1.5.0",
    "httpx>=0.27",
    "jinja2>=3.1.6",
    "pydantic>=2.7",
    "python-dotenv>=1.2.3",
]

[project.scripts]
sleeper-analyst = "sleeper_analyst.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sleeper_analyst"]

[tool.pytest.ini_options]
testpaths = ["tests"]
