# Copy to config.toml and fill in [league].
# Find your ids with: uv run sleeper-analyst setup --username YOUR_SLEEPER_NAME

[league]
league_id = ""
user_id = ""            # your Sleeper user_id (not username; usernames change)
timezone = "America/New_York"

# NFL bye weeks — 2026 season. Update each year after the schedule release.
[byes]
KC = 5
CAR = 5
MIA = 6
CIN = 6
DET = 6
MIN = 6
BUF = 7
LAC = 7
WAS = 7
JAX = 7
NYG = 8
NO = 8
SF = 8
HOU = 8
TEN = 9
PIT = 9
DEN = 10
PHI = 10
CHI = 10
TB = 10
NE = 11
CLE = 11
SEA = 11
GB = 11
ATL = 11
LAR = 11
IND = 13
NYJ = 13
LV = 13
BAL = 13
DAL = 14
ARI = 14

[philosophy]
risk_tolerance = "medium"        # low | medium | high
faab_aggressiveness = "medium"   # how much of remaining budget to spend on a top target
trade_appetite = "opportunistic" # none | opportunistic | active
priorities = ["RB depth", "streaming DEF"]
notes = ""                       # free text guidance for Claude, e.g. goals and house rules

[claude]
model = "claude-opus-5"
max_tokens = 16000
web_search = true

[delivery]
channel = "email"                # email | slack | discord | none
email_to = ""
# SMTP defaults are for Gmail (STARTTLS). The password is NOT set here:
# put a Gmail app password in .env as SMTP_PASSWORD (see .env.example).
smtp_host = "smtp.gmail.com"
smtp_port = 587
