name: weekly

on:
  schedule:
    # GitHub runs scheduled workflows on a best-effort queue and silently drops
    # or delays them under load, so each day gets three slots an hour apart.
    # `run --tag` is idempotent per (season, week, tag) via the deliveries table
    # in data/history.db, which the job commits back — so whichever slot lands
    # first sends the email and the rest stop right after the (free) collect,
    # before the Claude call. Extra slots cost a Sleeper API fetch, nothing more.
    - cron: "0 12 * * 2" # Tuesday 12:00 UTC = 07:00 EST / 08:00 EDT — full packet
    - cron: "0 13 * * 2"
    - cron: "0 14 * * 2"
    - cron: "0 12 * * 5" # Friday 12:00 UTC = 07:00 EST / 08:00 EDT — injury re-check
    - cron: "0 13 * * 5"
    - cron: "0 14 * * 5"
  workflow_dispatch:
    inputs:
      force:
        description: "Re-run even if this week was already delivered"
        type: boolean
        default: false
      tag:
        description: "Run type"
        type: choice
        options: [tuesday, friday]
        default: tuesday

permissions:
  contents: write

concurrency:
  group: weekly
  cancel-in-progress: false

jobs:
  packet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"

      - run: uv sync

      - name: Run weekly pipeline
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          # Any Friday cron (every Friday slot ends in "* 5") is the injury
          # re-check; Tuesday slots and a bare dispatch fall through to the tag
          # input, which defaults to tuesday.
          RUN_TAG: ${{ endsWith(github.event.schedule, '* 5') && 'friday' || inputs.tag || 'tuesday' }}
        run: uv run sleeper-analyst run --tag "$RUN_TAG" ${{ inputs.force && '--force' || '' }}

      # data/ (contexts, analyses, history.db) is committed back so the next
      # run's self-grading has last week's analysis. data/cache/ is gitignored.
      - name: Commit history back
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git diff --cached --quiet || (git commit -m "data: weekly run $(date -u +%F)" && git push)

      - name: Upload packet artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: packet
          path: |
            data/packet_week_*.md
            data/packet_week_*.html
          if-no-files-found: ignore
